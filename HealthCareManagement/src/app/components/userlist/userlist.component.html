<app-header></app-header>

<div class="nordis-main-heading">User List</div>

<div class="nordis-grid">
  <div *ngFor="let user of users | async" class="nordis-doctor-card">
    
    <!-- User Image -->
    <div class="nordis-doctor-image">
      <div class="nordis-doctor-avatar">
        <img *ngIf="user.photo; else fallbackImage"
             [src]="user.photo"
             alt="User Photo"
             style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover;">
        <ng-template #fallbackImage>
          <img [src]="user.gender === 'Female' || user.gender === 'female' ? 'assets/img/femaleuser.png' : 'assets/img/maleuser.png'"
               alt="Default User"
               style="width: 120px; height: 120px; border-radius: 50%;">
        </ng-template>
      </div>
    </div>

    <!-- User Details -->
    <div class="nordis-doctor-details">
      <div class="nordis-detail-row">
        <span class="nordis-label">Name:</span>
        <span class="nordis-value">{{user.username}}</span>
      </div>
      <div class="nordis-detail-row">
        <span class="nordis-label">Email:</span>
        <span class="nordis-value">{{user.email}}</span>
      </div>
      <div class="nordis-detail-row">
        <span class="nordis-label">Age:</span>
        <span class="nordis-value">{{user.age}} years</span>
      </div>
      <div class="nordis-detail-row">
        <span class="nordis-label">Gender:</span>
        <span class="nordis-value">{{user.gender}}</span>
      </div>
      <div class="nordis-detail-row">
        <span class="nordis-label">Mobile:</span>
        <span class="nordis-value">{{user.mobile}}</span>
      </div>
    </div>
  </div>
</div>

<br><br><br>
<app-footer></app-footer>
