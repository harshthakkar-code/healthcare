<app-header></app-header>

<div class="message" id="messagecard"><b>{{message}}</b></div>

<div class="container" id="add-prescription-form">
  <h2 class="textual"><i class="fa fa-sticky-note-o"></i> Add Your Prescriptions</h2>
  <form #addprescriptionform="ngForm" (ngSubmit)="addPrescription()">

    <!-- Patient Name -->
    <div class="form-group">
      <label for="patientname">Patient Name <b class="text-danger">*</b>
        <small style="color: gray; font-size: 12px;">(choose from the dropdown)</small>
      </label>
      <select class="form-control" id="patientname" name="patientname"
        [(ngModel)]="prescriptionobj.patientname" #patientname="ngModel" required
        [class.is-invalid]="patientname.invalid && patientname.touched">
        <option value="" disabled selected>Select patient</option>
        <option *ngFor="let patient of appointment | async" [ngValue]="patient.patientname">
          {{patient.patientname}}
        </option>
      </select>
      <small class="text-danger" *ngIf="patientname.errors?.required && patientname.touched">Please enter patient name.</small>
    </div>

    <!-- Doctor Name -->
    <div class="form-group">
      <label for="doctorname">Doctor Name <b class="text-danger">*</b>
        <small style="color: gray; font-size: 12px;">(please enter your name here)</small>
      </label>
      <input type="text" class="form-control" id="doctorname" name="doctorname"
        [(ngModel)]="prescriptionobj.doctorname" required #doctorname="ngModel"
        placeholder="Enter your name"
        [class.is-invalid]="doctorname.invalid && doctorname.touched">
      <small class="text-danger" *ngIf="doctorname.errors?.required && doctorname.touched">Please enter Doctor name.</small>
    </div>

    <!-- Disease -->
    <div class="form-group">
      <label for="disease">Patient's Disease <b class="text-danger">*</b></label>
      <input type="text" class="form-control" id="disease" name="disease"
        [(ngModel)]="prescriptionobj.disease" required #disease="ngModel"
        placeholder="Enter patient disease"
        [class.is-invalid]="disease.invalid && disease.touched">
      <small class="text-danger" *ngIf="disease.errors?.required && disease.touched">Please enter patient disease.</small>
    </div>

    <!-- Age -->
    <div class="form-group">
      <label for="age">Patient Age <b class="text-danger">*</b>
        <small style="color: gray; font-size: 12px;">(please enter proper age of the patient)</small>
      </label>
      <input type="text" class="form-control" id="age" name="age"
        [(ngModel)]="prescriptionobj.age" required #age="ngModel"
        placeholder="Enter patient age"
        [class.is-invalid]="age.invalid && age.touched">
      <small class="text-danger" *ngIf="age.errors?.required && age.touched">Please enter patient age.</small>
    </div>

    <!-- Gender -->
    <div class="form-group">
      <label for="gender">Patient Gender <b class="text-danger">*</b></label>
      <select class="form-control" id="gender" name="gender"
        [(ngModel)]="prescriptionobj.gender" #gender="ngModel" required
        [class.is-invalid]="gender.invalid && gender.touched">
        <option value="" disabled selected>Select gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
      <small class="text-danger" *ngIf="gender.errors?.required && gender.touched">Please select patient gender.</small>
    </div>

    <!-- Prescription -->
    <div class="form-group">
      <label for="prescription">Prescription <b class="text-danger">*</b></label>
      <textarea rows="5" class="form-control" id="prescription" name="prescription"
        [(ngModel)]="prescriptionobj.prescription" required #prescription="ngModel"
        placeholder="Enter your prescription here"
        [class.is-invalid]="prescription.invalid && prescription.touched"></textarea>
      <small class="text-danger" *ngIf="prescription.errors?.required && prescription.touched">Please enter your prescription.</small>
    </div>

    <button style="margin-top: 15px;" [disabled]="addprescriptionform.form.invalid"
      type="submit" class="btn registerbtn">
      <i class="fa fa-plus"></i>&nbsp; Add Prescription
    </button>
  </form>
</div>

<app-footer></app-footer>
