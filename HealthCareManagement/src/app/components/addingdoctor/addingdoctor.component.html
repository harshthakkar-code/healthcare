<div class="doctor-bg">
  <div class="doctor-card">
    <h2 class="doctor-title">
      <i class="fa fa-user-md"></i> New Doctor
    </h2>
    <div class="doctor-subinfo">
      On adding a doctor, they will be approved to work in the hospital management by default
    </div>
    <form #addDoctorform="ngForm" (ngSubmit)="addDoctor()">
      <!-- Doctor Name -->
      <div class="form-group">
        <label>Doctor Name <b class="text-danger">*</b></label>
        <input type="text" name="doctorname" [(ngModel)]="doctor.doctorname" required #doctorname="ngModel" placeholder="Enter doctor name" />
        <div class="doctor-error">
          <span *ngIf="doctorname.invalid && doctorname.touched">Name is required</span>
        </div>
      </div>
      <!-- Email -->
      <div class="form-group">
        <label>Email <b class="text-danger">*</b></label>
        <input type="email" name="email" [(ngModel)]="doctor.email" required #email="ngModel" placeholder="Enter email" />
        <div class="doctor-error">
          <span *ngIf="email.invalid && email.touched">Email is required</span>
        </div>
      </div>
      <!-- Mobile Number -->
      <div class="form-group">
        <label>Mobile Number <b class="text-danger">*</b></label>
        <input type="tel" name="mobile" [(ngModel)]="doctor.mobile" required #mobile="ngModel" maxlength="10" minlength="10" placeholder="Enter mobile number" />
        <div class="doctor-error">
          <span *ngIf="mobile.invalid && mobile.touched">Mobile is required</span>
        </div>
      </div>
      <!-- Gender -->
      <div class="form-group">
        <label>Gender <b class="text-danger">*</b></label>
        <select name="gender" [(ngModel)]="doctor.gender" #gender="ngModel" required>
          <option value="" disabled selected>Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Others</option>
        </select>
        <div class="doctor-error">
          <span *ngIf="gender.invalid && gender.touched">Gender is required</span>
        </div>
      </div>
      <!-- Experience -->
      <div class="form-group">
        <label>Experience (years) <b class="text-danger">*</b></label>
        <input type="number" name="experience" [(ngModel)]="doctor.experience" required #experience="ngModel" min="3" placeholder="Enter experience (min 3)" />
        <div class="doctor-error">
          <span *ngIf="experience.invalid && experience.touched">Minimum 3 years</span>
        </div>
      </div>
      <!-- Specialization -->
      <div class="form-group">
        <label>Specialization <b class="text-danger">*</b></label>
        <input type="text" name="specialization" [(ngModel)]="doctor.specialization" required #specialization="ngModel" placeholder="Specialization" />
        <div class="doctor-error">
          <span *ngIf="specialization.invalid && specialization.touched">Specialization is Required</span>
        </div>
      </div>
      <!-- Previous Hospital -->
      <div class="form-group">
        <label>Previous Hospital <b class="text-danger">*</b></label>
        <input type="text" name="previoushospital" [(ngModel)]="doctor.previoushospital" required #previoushospital="ngModel" placeholder="Previous Hospital" />
        <div class="doctor-error">
          <span *ngIf="previoushospital.invalid && previoushospital.touched">Hospital is Required</span>
        </div>
      </div>
      <!-- Address -->
      <div class="form-group">
        <label>Address <b class="text-danger">*</b></label>
        <input type="text" name="address" [(ngModel)]="doctor.address" required #address="ngModel" placeholder="Address" />
        <div class="doctor-error">
          <span *ngIf="address.invalid && address.touched"> Address is Required</span>
        </div>
      </div>
      <!-- Password -->
      <div class="form-group">
        <label>Password <b class="text-danger">*</b></label>
        <div class="password-field">
          <input
            [type]="showDoctorPassword ? 'text' : 'password'"
            name="pwd"
            [(ngModel)]="doctor.password"
            required
            #doctorpassword="ngModel"
            placeholder="Password *"
          />
          <span class="eye-icon" (click)="showDoctorPassword = !showDoctorPassword">
            <svg *ngIf="!showDoctorPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              width="22" height="22" fill="none">
              <ellipse cx="12" cy="12" rx="9" ry="6" stroke="#aaa" stroke-width="2" />
              <line x1="4" y1="20" x2="20" y2="4" stroke="#aaa" stroke-width="2" />
            </svg>
            <svg *ngIf="showDoctorPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
              width="22" height="22" fill="none">
              <ellipse cx="12" cy="12" rx="9" ry="6" stroke="#3dc2b8" stroke-width="2" />
              <circle cx="12" cy="12" r="2.5" fill="#3dc2b8" />
            </svg>
          </span>
        </div>
        <div class="doctor-error">
          <span *ngIf="doctorpassword.invalid && doctorpassword.touched">Password required</span>
        </div>
      </div>
      <!-- Authorized Checkbox -->
      <div class="form-group-checkbox">
        <input type="checkbox" name="remember" required style="margin-right:10px; width:18px; height:18px;" />
        <span>Authorized Doctor</span>
      </div>
      <button [disabled]="addDoctorform.form.invalid" type="submit" class="doctor-btn"><i class="fa fa-plus"></i>&nbsp; Add Doctor</button>
    </form>
  </div>
</div>
